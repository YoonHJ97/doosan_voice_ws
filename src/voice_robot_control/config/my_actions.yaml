# my_actions.yaml — 우리 팀이 직접 만드는 동작
#
# 여기에 동작을 만들고, keyword_map.yaml 에 그 이름으로 낱말을 붙이면
# 말로 시킬 수 있습니다. 파이썬을 고칠 필요가 없습니다.
#
# ── 만드는 순서 ──────────────────────────────────────────
#  1) 이 파일에 동작을 만든다        (아래 예시 참고)
#  2) keyword_map.yaml 의 commands: 밑에 같은 이름으로 낱말을 붙인다
#         commands:
#           인사:
#             - 인사해
#             - 안녕
#  3) nlp_node 와 voice_robot_node 를 껐다 켠다  (다시 빌드 안 함)
#  4) "인사해" 라고 말한다
#
# ── 쓸 수 있는 동작 한 줄 ────────────────────────────────
#   - 홈                                 홈 자세로 간다
#   - 이동: {x: 0.4, y: 0.0, z: 0.45}     그 좌표로 간다  [m]
#   - 관절: [0, 0, 90, 0, 90, 0]          관절 6개를 그 각도로  [도]
#   - 집기: 2                             2번 기어를 집는다
#   - 놓기: 2                             2번 기어를 놓는다
#   - 열기                                그리퍼를 연다
#   - 닫기                                그리퍼를 닫는다
#   - 기다리기: 1.0                        그만큼 쉰다  [초]
#
# ※ 좌표가 안전 범위를 벗어나면 자동으로 경계까지만 갑니다.
# ※ 위에서부터 순서대로 하나씩 실행합니다.


actions:

  # ── 예시 1) 손을 좌우로 흔들어 인사하기 ──────────────
  인사:
    - 홈
    - 이동: {x: 0.40, y:  0.15, z: 0.50}
    - 이동: {x: 0.40, y: -0.15, z: 0.50}
    - 이동: {x: 0.40, y:  0.15, z: 0.50}
    - 이동: {x: 0.40, y: -0.15, z: 0.50}
    - 홈

  # ── 예시 2) 그리퍼를 두 번 쥐었다 펴기 ───────────────
  집게운동:
    - 닫기
    - 열기
    - 닫기
    - 열기

  # ── 예시 3) 기어 두 개만 골라서 옮기기 ───────────────
  둘만옮기기:
    - 홈
    - 집기: 1
    - 놓기: 1
    - 집기: 3
    - 놓기: 3
    - 홈


# ══════════════════════════════════════════════════════════
#  ▼▼▼ 우리 팀 동작은 여기에 만드세요 ▼▼▼
#
#  우리팀동작:
#    - 홈
#    - 이동: {x: 0.45, y: 0.0, z: 0.40}
#    - 기다리기: 1.0
#    - 홈
#
#  좌표를 모르겠으면 위치 보기를 켜고 확인하세요.
#      ros2 launch voice_robot_control viewer.launch.py
# ══════════════════════════════════════════════════════════
